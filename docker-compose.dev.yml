version: '3.9'

# Development override — no SSL, ports exposed for debugging
services:
  postgres:
    image: postgres:16-alpine
    container_name: giron_postgres_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: giron_security_dev
      POSTGRES_USER: giron_dev
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  backend:
    build:
      context: ./backend
    container_name: giron_backend_dev
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_NAME: giron_security_dev
      DB_USER: giron_dev
      DB_PASSWORD: devpassword
      JWT_SECRET: dev-jwt-secret-change-in-production-please
      JWT_EXPIRES_IN: 24h
      FRONTEND_URL: http://localhost:3000
      ADMIN_EMAIL: admin@giron.co.il
      ADMIN_PASSWORD: Admin@2024!
      BCRYPT_ROUNDS: 10
      LOG_LEVEL: debug
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM: '"Dev" <dev@giron.co.il>'
    volumes:
      - ./backend/src:/app/src
      - backend_dev_logs:/app/logs
    depends_on:
      - postgres
      - mailhog
    command: npm run dev

  frontend:
    image: node:20-alpine
    container_name: giron_frontend_dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3001/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: giron_mailhog
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP

volumes:
  postgres_dev_data:
  backend_dev_logs:
